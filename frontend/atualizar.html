<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Atualizando Arte de Aprender</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8f2fb;color:#2f2433;min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{max-width:520px;width:100%;background:#fff;border-radius:24px;padding:28px;box-shadow:0 18px 50px rgba(73,43,82,.14);text-align:center}
    h1{color:#713978;margin:0 0 12px}p{line-height:1.55;color:#5a515f}strong{color:#713978}
    button{border:0;border-radius:14px;padding:13px 20px;background:linear-gradient(135deg,#9f5aa6,#713978);color:#fff;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>Atualizando o Arte de Aprender</h1>
    <p id="status">Removendo apenas os arquivos temporários da versão anterior. <strong>Seus cadastros não serão apagados.</strong></p>
    <button id="retry" type="button" hidden>Tentar novamente</button>
  </main>
  <script src="atualizar.js?v=1" defer></script>
</body>
</html>
