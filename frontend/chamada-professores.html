<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chamada dos Professores · Arte de Aprender</title>
    <link rel="stylesheet" href="teacher-bundle.min.css?v=2" />
    <link rel="icon" type="image/png" href="favicon-96.png?v=1" />
    <meta name="theme-color" content="#9f5aa6" />
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body data-app-version="4.6.9">
    <main class="teacher-app" id="teacherApp">
      <header class="teacher-topbar">
        <div class="brand">
          <img src="app-icon-192.png?v=1" alt="Arte de Aprender" />
          <div>
            <strong>Chamada dos professores</strong>
            <span>Acesso exclusivo para presença, falta e horários · V4.6.9</span>
          </div>
        </div>
        <div class="teacher-actions">
          <a href="index.html" class="secondary-link">Painel</a>
        </div>
      </header>

      <section class="control-card">
        <label>
          Data da chamada
          <input type="date" id="teacherAttendanceDate" />
        </label>
        <button id="refreshTeacherAttendance" type="button">Atualizar lista</button>
        <button id="saveTeacherAttendance" type="button">Salvar</button>
      </section>

      <section class="activity-card">
        <div>
          <h2>Atividade</h2>
          <p id="teacherActivityInfo">Carregando atividades...</p>
        </div>
        <div class="activity-tabs" id="teacherActivityTabs"></div>
      </section>

      <section class="status-card" id="teacherStatus">Carregando chamada sincronizada...</section>

      <section class="attendance-list" id="teacherAttendanceList"></section>
    </main>

    <script src="teacher-bundle.min.js?v=2"></script>
  </body>
</html>
