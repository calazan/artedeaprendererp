name: Security checks

on:
  pull_request:
  push:
    branches: [main, "security/**"]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt

      - name: Validate Python syntax
        run: python scripts/check_project.py

      - name: Run complete Python test suite
        run: python -m pytest -q
        env:
          PYTHONPATH: .

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Bandit static security analysis
        run: bandit -q -r smg api scripts app.py -x tests -ll

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
