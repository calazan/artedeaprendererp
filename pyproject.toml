requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.3",
  "psycopg[binary,pool]==3.3.4",
  "httpx==0.28.1",
  "python-dotenv==1.2.2",
  "cryptography==50.0.0",
  "pywebpush==2.4.0",
  "argon2-cffi==25.1.0",
]

[tool.vercel]
entrypoint = "app:app"
